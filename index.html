<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AddCalc — Simple Addition Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-text: #0f172a;
      --plus-bg: #6366f1;
      --plus-hover: #4f46e5;
      --equal-bg: #10b981;
      --equal-hover: #059669;
      --danger: #f43f5e;
      --danger-hover: #e11d48;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.4;
    }

    .app-container {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (min-width: 720px) {
      .app-container {
        grid-template-columns: 360px 1fr;
      }
    }

    .calculator {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .calc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .display {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      text-align: right;
      min-height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .expression {
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 22px;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .expression::-webkit-scrollbar {
      display: none;
    }

    .current-value {
      font-size: 2.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      word-break: break-all;
      line-height: 1.15;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      font-family: inherit;
      border: none;
      border-radius: 14px;
      min-height: 56px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      background: var(--surface-alt);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.08s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: #334155;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-clear {
      background: rgba(244, 63, 94, 0.16);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.3);
    }

    .btn-clear:hover {
      background: rgba(244, 63, 94, 0.28);
    }

    .btn-backspace {
      background: #1e293b;
      color: var(--text-muted);
      border-color: var(--border);
    }

    .btn-backspace:hover {
      color: var(--text);
      background: #334155;
    }

    .btn-plus {
      background: var(--plus-bg);
      color: #ffffff;
      grid-row: span 2;
      font-size: 1.6rem;
    }

    .btn-plus:hover {
      background: var(--plus-hover);
    }

    .btn-equal {
      background: var(--equal-bg);
      color: #ffffff;
      grid-row: span 2;
      font-size: 1.6rem;
    }

    .btn-equal:hover {
      background: var(--equal-hover);
    }

    .btn-zero {
      grid-column: span 2;
    }

    /* History Panel */
    .history-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      max-height: 460px;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .history-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-history {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 10px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-clear-history:hover {
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.1);
    }

    .history-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      padding-right: 4px;
    }

    .history-item {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .history-item:hover {
      border-color: var(--accent);
      background: #131c31;
    }

    .history-expr {
      font-size: 0.82rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .history-res {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--equal-bg);
      font-variant-numeric: tabular-nums;
    }

    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 36px 12px;
    }

    .keyboard-hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="app-container">
    <section class="calculator" aria-label="Addition Calculator">
      <header class="calc-header">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="12" y1="10" x2="12" y2="18"></line>
            <line x1="8" y1="14" x2="16" y2="14"></line>
          </svg>
          <span>AddCalc</span>
        </div>
        <span class="badge">Add Only</span>
      </header>

      <div class="display" aria-live="polite">
        <div class="expression" id="expression"></div>
        <div class="current-value" id="display">0</div>
      </div>

      <div class="keypad">
        <button type="button" class="btn-clear" data-action="clear" aria-label="Clear">C</button>
        <button type="button" class="btn-backspace" data-action="backspace" aria-label="Backspace">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>

        <button type="button" data-digit="9">9</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" class="btn-plus" data-action="add" aria-label="Add">+</button>

        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>

        <button type="button" data-digit="3">3</button>
        <button type="button" class="btn-zero" data-digit="0">0</button>
        <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="btn-equal" data-action="equals" aria-label="Equals">=</button>
      </div>

      <p class="keyboard-hint">Keyboard: 0–9, +, ., Enter (=), Backspace, Esc (Clear)</p>
    </section>

    <aside class="history-panel" aria-label="Addition History">
      <div class="history-header">
        <h2 class="history-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Addition Tape
        </h2>
        <button type="button" class="btn-clear-history" id="clearHistoryBtn">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </aside>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "addcalc_history_v1";
      let memoryHistory = [
        { expr: "12.5 + 7.5", result: "20" },
        { expr: "100 + 250 + 50", result: "400" }
      ];

      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {
          // Fallback to in-memory history
        }
        return memoryHistory;
      }

      function saveHistory(items) {
        memoryHistory = items;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (e) {
          // Ignore storage errors in restricted sandboxes
        }
      }

      const displayEl = document.getElementById("display");
      const expressionEl = document.getElementById("expression");
      const historyListEl = document.getElementById("historyList");
      const clearHistoryBtn = document.getElementById("clearHistoryBtn");

      let currentInput = "0";
      let terms = [];
      let justEvaluated = false;
      let history = loadHistory();

      function formatNumber(num) {
        // Avoid floating point noise like 0.1 + 0.2 = 0.30000000000000004
        const rounded = Math.round((num + Number.EPSILON) * 1e10) / 1e10;
        return String(rounded);
      }

      function updateDisplay() {
        displayEl.textContent = currentInput;
        if (terms.length > 0) {
          expressionEl.textContent = terms.join(" + ") + " +";
        } else {
          expressionEl.textContent = "";
        }
      }

      function renderHistory() {
        historyListEl.innerHTML = "";
        if (history.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-history";
          empty.textContent = "No additions yet. Enter numbers and press + or =.";
          historyListEl.appendChild(empty);
          return;
        }

        history.forEach((item) => {
          const li = document.createElement("li");
          li.className = "history-item";
          li.title = "Click to load result";

          const exprSpan = document.createElement("span");
          exprSpan.className = "history-expr";
          exprSpan.textContent = item.expr + " =";

          const resSpan = document.createElement("span");
          resSpan.className = "history-res";
          resSpan.textContent = item.result;

          li.appendChild(exprSpan);
          li.appendChild(resSpan);

          li.addEventListener("click", () => {
            currentInput = item.result;
            terms = [];
            justEvaluated = true;
            updateDisplay();
          });

          historyListEl.appendChild(li);
        });
      }

      function appendDigit(digit) {
        if (justEvaluated) {
          currentInput = digit;
          terms = [];
          justEvaluated = false;
        } else if (currentInput === "0") {
          currentInput = digit;
        } else if (currentInput.length < 16) {
          currentInput += digit;
        }
        updateDisplay();
      }

      function appendDecimal() {
        if (justEvaluated) {
          currentInput = "0.";
          terms = [];
          justEvaluated = false;
        } else if (!currentInput.includes(".")) {
          currentInput += ".";
        }
        updateDisplay();
      }

      function handleAdd() {
        const val = parseFloat(currentInput);
        if (isNaN(val)) return;

        if (justEvaluated) {
          terms = [formatNumber(val)];
          justEvaluated = false;
        } else {
          terms.push(formatNumber(val));
        }

        currentInput = "0";
        updateDisplay();
      }

      function handleEquals() {
        const val = parseFloat(currentInput);
        if (isNaN(val)) return;

        if (terms.length === 0) {
          // Single number, nothing to add yet
          justEvaluated = true;
          updateDisplay();
          return;
        }

        const allTerms = [...terms, formatNumber(val)];
        const sum = allTerms.reduce((acc, t) => acc + parseFloat(t), 0);
        const resultStr = formatNumber(sum);
        const exprStr = allTerms.join(" + ");

        expressionEl.textContent = exprStr + " =";
        currentInput = resultStr;
        displayEl.textContent = currentInput;
        terms = [];
        justEvaluated = true;

        history = [{ expr: exprStr, result: resultStr }, ...history].slice(0, 30);
        saveHistory(history);
        renderHistory();
      }

      function handleClear() {
        currentInput = "0";
        terms = [];
        justEvaluated = false;
        updateDisplay();
      }

      function handleBackspace() {
        if (justEvaluated) {
          handleClear();
          return;
        }
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = "0";
        }
        updateDisplay();
      }

      document.querySelector(".keypad").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;

        const digit = btn.getAttribute("data-digit");
        const action = btn.getAttribute("data-action");

        if (digit !== null) {
          appendDigit(digit);
        } else if (action === "decimal") {
          appendDecimal();
        } else if (action === "add") {
          handleAdd();
        } else if (action === "equals") {
          handleEquals();
        } else if (action === "clear") {
          handleClear();
        } else if (action === "backspace") {
          handleBackspace();
        }
      });

      clearHistoryBtn.addEventListener("click", () => {
        history = [];
        saveHistory(history);
        renderHistory();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key >= "0" && e.key <= "9") {
          appendDigit(e.key);
        } else if (e.key === ".") {
          appendDecimal();
        } else if (e.key === "+") {
          e.preventDefault();
          handleAdd();
        } else if (e.key === "Enter" || e.key === "=") {
          e.preventDefault();
          handleEquals();
        } else if (e.key === "Backspace") {
          handleBackspace();
        } else if (e.key === "Escape" || e.key.toLowerCase() === "c") {
          handleClear();
        }
      });

      updateDisplay();
      renderHistory();
    })();
  </script>
</body>
</html>
